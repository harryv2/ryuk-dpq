syntax = "proto3";

package ryuk.queue.v1;

option go_package = "github.com/harryv2/ryuk-dpq/backend/proto/queue/v1;queuev1";

// QueueSpec travels with every request so a node can materialise a queue it has
// not seen without a separate create call.
message QueueSpec {
  string org = 1;
  string name = 2;
  int64 visibility_timeout_ns = 3;
  uint32 max_retries = 4;
  int64 default_ttl_ns = 5;
  int64 starvation_threshold_ns = 6;
  double starvation_reserve = 7;
  int64 max_depth = 8;
  bool distributed = 9;
  uint64 generation = 10;
  // Whether failures have anywhere to go. Without a dead-letter queue a message
  // that runs out of retries keeps being redelivered rather than dropped.
  bool has_dead_letter = 11;
}

message DeadLetter {
  string org = 1;
  string name = 2;
  uint32 slot = 3;
  WireMessage message = 4;
}

message DeadLetterResponse {
  repeated DeadLetter dead_letters = 1;
}

message AckDeadLettersRequest {
  repeated string message_ids = 1;
}

message EnqueueRequest {
  QueueSpec spec = 1;
  // Set when the caller has already chosen the slot, which it has to for a
  // grouped message so ordering holds.
  optional uint32 slot = 2;
  bytes payload = 3;
  uint32 priority = 4;
  string group_id = 5;
  int64 ttl_ns = 6;
  int64 deliver_after_ns = 7;
}

message EnqueueResponse {
  string message_id = 1;
  uint32 slot = 2;
  uint64 seq = 3;
}

message DequeueRequest {
  QueueSpec spec = 1;
  int32 max_messages = 2;
}

message DeliveredMessage {
  string message_id = 1;
  bytes payload = 2;
  uint32 priority = 3;
  string group_id = 4;
  uint32 attempts = 5;
  int64 enqueued_at_unix_ns = 6;
  string receipt = 7;
}

message DequeueResponse {
  repeated DeliveredMessage messages = 1;
}

message AckRequest {
  QueueSpec spec = 1;
  string receipt = 2;
}

message NackRequest {
  QueueSpec spec = 1;
  string receipt = 2;
  int64 delay_ns = 3;
}

message Empty {}

message StatsRequest {
  QueueSpec spec = 1;
}

message FreezeRequest {
  QueueSpec spec = 1;
  // Empty means every slot this node holds for the queue. A distributed queue
  // moves one slot at a time, so only those are named.
  repeated uint32 slots = 2;
}

message QueueStats {
  string org = 1;
  string name = 2;
  // ready is bucketed low, medium, high -- the granularity metrics report at.
  repeated int64 ready = 3;
  int64 in_flight = 4;
  int64 delayed = 5;
  int64 oldest_age_ns = 6;
  uint64 enqueued = 7;
  uint64 acked = 8;
  uint64 expired = 9;
  uint64 requeued = 10;
  uint64 dead_lettered = 11;
  uint64 escapes = 12;
}

message StatsAllResponse {
  string node_id = 1;
  repeated QueueStats queues = 2;
}

message WireMessage {
  string id = 1;
  bytes payload = 2;
  uint32 priority = 3;
  string group_id = 4;
  uint64 seq = 5;
  int64 enqueued_at_unix_ns = 6;
  int64 expires_at_unix_ns = 7;
  int64 deliver_after_unix_ns = 8;
  uint32 attempts = 9;
}

message SlotMessages {
  repeated WireMessage messages = 1;
}

// Transfer carries a queue's contents to its new owner, keyed by slot so
// placement survives the move.
message Transfer {
  QueueSpec spec = 1;
  map<uint32, SlotMessages> by_slot = 2;
  // Identifies one handoff, so absorbing the same one twice is a no-op.
  string move_id = 3;
}

// Names the slots of one queue for a step of a handoff.
message SlotSet {
  QueueSpec spec = 1;
  repeated uint32 slots = 2;
  string move_id = 3;
}

// What a node actually holds, for the reconciler to compare against placement.
message HeldSlots {
  string org = 1;
  string queue = 2;
  repeated uint32 slots = 3;
  repeated uint32 frozen = 4;
}

message HeldResponse {
  string node_id = 1;
  repeated HeldSlots queues = 2;
}

message SubscribeRequest {
  string gateway_id = 1;
}

// WorkAvailable is pushed when a queue on this node gains work. A gateway keeps
// one stream per node, not one per queue and not one per waiting consumer.
message WorkAvailable {
  string org = 1;
  string name = 2;
  reserved 3; // was best_priority; a gateway wakes per queue, not per priority
}

message HealthResponse {
  string status = 1;
  string node_id = 2;
}

service QueueService {
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse);
  rpc Dequeue(DequeueRequest) returns (DequeueResponse);
  rpc Ack(AckRequest) returns (Empty);
  rpc Nack(NackRequest) returns (Empty);

  rpc Stats(StatsRequest) returns (QueueStats);
  rpc StatsAll(Empty) returns (StatsAllResponse);

  rpc Drop(StatsRequest) returns (Empty);
  // A handoff. PrepareMove snapshots without removing, so a move that fails
  // leaves this node still able to serve. DiscardMove is what finally removes,
  // and only runs once the new owner is serving; AbortMove puts them back.
  rpc PrepareMove(SlotSet) returns (Transfer);
  rpc Absorb(Transfer) returns (Empty);
  rpc DiscardMove(SlotSet) returns (Empty);
  rpc AbortMove(SlotSet) returns (Empty);

  // Freeze is the old destructive form, kept for whole-queue migration.
  rpc Freeze(FreezeRequest) returns (Transfer);

  // Held reports what this node has, so the gateway can reconcile it against
  // placement and repair anything a failed handoff left behind.
  rpc Held(Empty) returns (HeldResponse);

  // A node cannot route a dead letter itself: it does not know which node owns
  // the dead-letter queue, and placement is the gateway's to read. So it holds
  // them and the gateway drains them. They are only dropped once the gateway
  // confirms they landed, so a gateway dying in between costs a duplicate in
  // the dead-letter queue rather than a lost message.
  rpc DeadLetters(Empty) returns (DeadLetterResponse);
  rpc AckDeadLetters(AckDeadLettersRequest) returns (Empty);

  // Subscribe is how a parked consumer is woken. Notification and dequeue are
  // separate so only one dequeue is ever issued: fanning a waiting dequeue out
  // to several nodes would lease messages nobody is processing.
  rpc Subscribe(SubscribeRequest) returns (stream WorkAvailable);

  rpc Health(Empty) returns (HealthResponse);
}
