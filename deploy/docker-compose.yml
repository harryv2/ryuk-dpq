name: ${COMPOSE_PROJECT_NAME:-ryuk}

# Everything writes into ../data so the write-ahead logs, Postgres and etcd are
# all visible on the host. The integration suite overrides RYUK_DATA and
# RYUK_PORT so it can run its own stack beside a development one.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ryuk
      POSTGRES_PASSWORD: ryuk
      POSTGRES_DB: ryuk
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${RYUK_DATA:-../data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryuk"]
      interval: 2s
      timeout: 3s
      retries: 30

  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    environment:
      ETCD_UNSUPPORTED_ARCH: arm64
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://etcd:2380
      - --initial-advertise-peer-urls=http://etcd:2380
    volumes:
      - ${RYUK_DATA:-../data}/etcd:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Scale freely: docker compose up --scale node=6
  # A node needs one setting, the etcd address. It takes its identity from its
  # own data directory and its address from its hostname, so replicas need no
  # configuration of their own.
  node:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
    environment:
      RYUK_LISTEN: ":9090"
      RYUK_DATA_DIR: /data/nodes
      RYUK_DATA_PER_HOST: "1"      # each replica gets /data/nodes/<hostname>
      RYUK_ETCD: etcd:2379
      RYUK_WAL_SYNC: interval
      RYUK_LOG_FORMAT: json
    volumes:
      - ${RYUK_DATA:-../data}:/data
    depends_on:
      etcd:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    ports:
      - "${RYUK_PORT:-8090}:8080"
    environment:
      RYUK_LISTEN: ":8080"
      RYUK_POSTGRES: postgres://ryuk:ryuk@postgres:5432/ryuk?sslmode=disable
      RYUK_ETCD: etcd:2379
      RYUK_STATIC_DIR: /srv/ui
      RYUK_LOG_FORMAT: json
    healthcheck:
      test: ["CMD", "ryuk-gateway", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 45
    depends_on:
      postgres:
        condition: service_healthy
      etcd:
        condition: service_healthy
